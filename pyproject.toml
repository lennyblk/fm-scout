[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-scout"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "pyyaml>=6", "pydantic>=2", "httpx>=0.27"]

[project.optional-dependencies]
fmsave = ["fmsave>=0.14.4"]
dev = ["pytest>=8"]

[project.scripts]
fm-scout = "fm_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fm_scout = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
